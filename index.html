<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="carry.js"></script>
  <title>Post Time</title>
  <meta name="description" content="A day at the races at Larkspur Downs. Read the form, see what the regulars on the forum are betting, play the tote, then watch every race from the gate to the wire. Horses, form and your bankroll carry over from one race day to the next.">
  <meta property="og:title" content="Post Time">
  <meta property="og:description" content="A day at the races: read the form, bet the tote, watch every race from the gate to the wire.">
  <meta property="og:image" content="https://post-time.junkdrawer.works/og.png">
  <meta property="og:url" content="https://post-time.junkdrawer.works/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1f4d3a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#173a2c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preload" href="fonts/oswald.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/plex-condensed-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <noscript><p class="noscript">Post Time needs JavaScript to run the races.</p></noscript>
  <header class="top" id="top">
    <button class="brand" type="button" data-go="card" aria-label="Back to the race card">
      <span class="brand-name">Post Time</span>
      <span class="brand-track">Larkspur Downs</span>
    </button>
    <div class="bank" id="bank" aria-live="polite" title="Your bankroll"></div>
    <button class="cloud" type="button" id="cloud" hidden></button>
    <button class="menu-btn" type="button" id="menuBtn" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>
  <nav class="menu" id="menu" hidden>
    <button type="button" data-go="card">Today's card</button>
    <button type="button" data-go="book">Scrapbook &amp; record</button>
    <button type="button" data-go="meet">The meet so far</button>
    <button type="button" data-go="help">How to play</button>
    <label class="toggle"><input type="checkbox" id="optSound"> Sound</label>
    <label class="toggle"><input type="checkbox" id="optVoice"> Read the race call aloud</label>
    <div class="voice-row" id="voiceRow" hidden>
      <label for="optVoiceName">Voice</label>
      <select id="optVoiceName"></select>
      <p class="voice-note" id="voiceNote"></p>
      <p class="voice-note" id="voiceMore"></p>
      <div class="joe" id="joeRow" hidden>
        <p class="voice-note" id="joeNote"></p>
        <div class="bar" id="joeBar" hidden><i></i></div>
        <div class="joe-btns">
          <button type="button" id="joeGet">Download Joe</button>
          <button type="button" id="joeStop">Stop</button>
          <button type="button" id="joeRemove">Remove Joe</button>
        </div>
      </div>
      <button type="button" id="hearIt">Hear it</button>
      <p class="voice-note" id="voiceNone" hidden>This browser has no voice to read the call. The call is still written out as the race is run.</p>
    </div>
    <div class="drive" id="driveRow" hidden></div>
    <div class="keep" id="keepRow" hidden>
      <button type="button" id="saveCopy">Save a copy</button>
      <button type="button" id="openCopy">Open a copy</button>
      <input type="file" id="copyFile" accept=".json,application/json" hidden>
      <p class="voice-note" id="copyNote" role="status"></p>
    </div>
    <button type="button" id="restart" class="quiet">Start over</button>
  </nav>
  <main id="app" class="app"></main>
  <div class="watch" id="watch" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
